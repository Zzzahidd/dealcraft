<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Dealcraft Spotlight</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400&display=swap"
    />
    <script>
      (function() {
        try {
          var raw = localStorage.getItem('dealcraft.v5');
          if (raw) {
            var j = JSON.parse(raw);
            if (j && j.prefs && j.prefs.theme) {
              if (j.prefs.theme !== 'system') {
                document.documentElement.setAttribute('data-theme', j.prefs.theme);
              }
              if (j.prefs.accent && j.prefs.accent !== 'indigo') {
                document.documentElement.setAttribute('data-accent', j.prefs.accent);
              }
            }
          }
        } catch (e) {}
      })();
    </script>
    <style>
      html,
      body {
        background: transparent !important;
        background-color: transparent !important;
        margin: 0 !important;
        padding: 0 !important;
        width: 100vw !important;
        height: 100vh !important;
        overflow: hidden !important;
        user-select: none;
      }
      #spotlight-root {
        width: 100vw !important;
        height: 100vh !important;
        margin: 0 !important;
        padding: 0 !important;
        background: transparent !important;
        display: flex;
        overflow: hidden;
      }
    </style>
  </head>
  <body class="spotlight-body">
    <div id="spotlight-root"></div>
    <script type="module" src="/src/spotlight.js"></script>
  </body>
</html>
